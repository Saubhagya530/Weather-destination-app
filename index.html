<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheather</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <i class='bx bxs-map'></i>
            <input type="text" placeholder="Enter Your Location">
            <button class="search-button"><i class="bx bx-search"></i></button>
        </div>

        <div class="weather-box" style="display: none;">
            <div class="box">
                <div class="info-weather">
                    <div class="weather">
                        <img src="images/3.png">
                        <p class="temperature">0<span>°C</span></p>
                         <p class="description"></p>   
                </div>
            </div>
        </div>
        </div>
		<br><br>
        <div class="weather-details" style="display: none;">
            <div class="humidity">
                <i class="bx bx-water"></i>
                <div class="text">
                    <div class="info-humidity">
                        <span>0%</span>
                    </div>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="wind">
                <i class="bx bx-wind"></i>
                <div class="text">
                    <div class="info-wind">
                        <span>0Km/h</span>
                    </div>
                    <p>Wind Speed</p>
                </div>

        </div>

        </div>

        <div class="not-found" style="display: none;">
                <div class="box">
                    <!-- <img src="images/6.webp"> -->
                    <p>Location Not Found!</p>
                </div>
        </div>
        </div>


        <script src="script.js"></script>
    
</body>
</html>
